name: Build KianaBH3 Android (linux-arm64-zip)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # ✅ 打 tag 才触发 Release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '9.0.x'
      PUBLISH_DIR: ./publish/linux-arm64

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true     # ✅ 确保 tag 信息完整

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore KianaBH.sln

    - name: Publish KianaBH (linux-arm64 self-contained)
      run: |
        dotnet publish KianaBH/KianaBH.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ${{ env.PUBLISH_DIR }} \
          --no-restore

    - name: Zip output
      run: |
        cd ${{ env.PUBLISH_DIR }}
        zip -r ../KianaBH3-Android-arm64.zip .

    - name: Upload Artifact (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: KianaBH3-Android-arm64
        path: ./publish/KianaBH3-Android-arm64.zip
        retention-days: 30

    # ✅ 仅在 tag 时发布 Release
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: KianaBH3 ${{ github.ref_name }} (Android arm64)
        body: |
          ### KianaBH3 Android (linux-arm64)

          - Runtime: .NET 9 Self-contained
          - Target: linux-arm64
          - Build: ${{ github.ref_name }}

          > 适用于 Android Termux / chroot / proot 环境
        files: ./publish/KianaBH3-Android-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
