name: Build KianaBH3 Android (linux-arm64-zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '9.0.x'
      PUBLISH_DIR: ./publish/linux-arm64

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive   # 必须，KianaBH3 有子模块

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore KianaBH.sln

    - name: Publish KianaBH (linux-arm64 self-contained)
      run: |
        dotnet publish KianaBH/KianaBH.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ${{ env.PUBLISH_DIR }} \
          --no-restore

    - name: Zip output
      run: |
        cd ${{ env.PUBLISH_DIR }}
        zip -r ../KianaBH3-Android-arm64.zip .

    - name: Upload Artifact (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: KianaBH3-Android-arm64
        path: ./publish/KianaBH3-Android-arm64.zip
        retention-days: 30
