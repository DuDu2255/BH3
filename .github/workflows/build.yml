name: Build KianaBH3 Android (linux-arm64-zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '9.0.x'
      PUBLISH_DIR: ./publish/linux-arm64

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive   # 必须，KianaBH3 有子模块

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore KianaBH.sln

    - name: Publish KianaBH (linux-arm64 self-contained)
      run: |
        dotnet publish KianaBH/KianaBH.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ${{ env.PUBLISH_DIR }} \
          --no-restore

    - name: Zip output
      run: |
        cd ${{ env.PUBLISH_DIR }}
        zip -r ../KianaBH3-Android-arm64.zip .

    # ===== 新增：创建并上传 Releases =====
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 自动使用仓库的 token
      with:
        tag_name: v${{ github.run_number }}       # 生成版本号（如 v1, v2...）
        release_name: KianaBH3 Android (v${{ github.run_number }})
        body: |
          🚀 Automated build for KianaBH3 Android (linux-arm64)
          - Built on: ${{ github.event.repository.updated_at }}
          - Commit: ${{ github.sha }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/KianaBH3-Android-arm64.zip
        asset_name: KianaBH3-Android-arm64.zip
        asset_content_type: application/zip
    # ===================================

    - name: Upload Artifact (ZIP)  # 保留原有的 Artifact 上传（可选）
      uses: actions/upload-artifact@v4
      with:
        name: KianaBH3-Android-arm64
        path: ./publish/KianaBH3-Android-arm64.zip
        retention-days: 30
