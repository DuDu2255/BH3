name: Build KianaBH3 Android (linux-arm64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允许手动触发
  # 也可以取消下面两行，改为只在打 tag 时编译
  # release:
  #   types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '9.0.x'
      SOLUTION: KianaBH.sln
      PUBLISH_DIR: ./publish/linux-arm64

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive   # ← 重要！KianaBH3 有 submodule

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Publish KianaBH (linux-arm64 self-contained)
      run: |
        dotnet publish KianaBH/KianaBH.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ${{ env.PUBLISH_DIR }} \
          --no-restore

    - name: Package artifact
      run: |
        cd ${{ env.PUBLISH_DIR }}
        tar czf ../KianaBH3-Android-arm64.tar.gz .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KianaBH3-Android-arm64
        path: ./publish/KianaBH3-Android-arm64.tar.gz
        retention-days: 30

