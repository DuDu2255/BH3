name: Build KianaBH3 Android (linux-arm64-zip)

on:
  push:
    branches: [ 主要 ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否发布 Releases？"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '9.0.x'
      PUBLISH_DIR: ./publish/linux-arm64

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore KianaBH.sln

    - name: Publish KianaBH (linux-arm64 self-contained)
      run: |
        dotnet publish KianaBH/KianaBH.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained true \
          -o ${{ env.PUBLISH_DIR }} \
          --no-restore

    - name: Zip output
      run: |
        cd ${{ env.PUBLISH_DIR }}
        zip -r ../KianaBH3-Android-arm64.zip .

    # ===== 可选：创建 Release =====
    - name: Create Release
      if: ${{ github.event.inputs.publish_release == 'true' }}
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: android-v${{ github.run_number }}
        release_name: KianaBH3 Android v${{ github.run_number }}
        body: |
          🚀 自动构建 KianaBH3 Android (linux-arm64)

          - Commit: ${{ github.sha }}
          - 构建时间: ${{ github.event.repository.updated_at }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: ${{ github.event.inputs.publish_release == 'true' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/KianaBH3-Android-arm64.zip
        asset_name: KianaBH3-Android-arm64.zip
        asset_content_type: application/zip
    # ==============================

    - name: Upload Artifact (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: KianaBH3-Android-arm64
        path: ./publish/KianaBH3-Android-arm64.zip
        retention-days: 30
